name: Qobuz Personal APK (isolated)
# Re-run build request: 2026-11-13
on:
  push:
    branches:
      - build/qobuz-personal-2026-11-13
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-qobuz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure sdkmanager from preinstalled Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Install platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Checkout verified Qobuz extension
        run: |
          git clone https://github.com/TheWinner02/echo-qobuz-extension.git qobuz-extension
          cd qobuz-extension
          git checkout --detach a53ab8e95e6b60d0f0efb038a49fd24e1255dcf1
      - name: Apply Qobuz Personal patch (source SHA256 verified)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib,base64,hashlib
          blob=zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(blob).hexdigest() == "038c4142288e56b9542f3d32dc06e4b88caae58c49f131969dbe40da2c628895"
          Path("patch_qobuz_personal.py").write_bytes(blob)
          PY
          python3 patch_qobuz_personal.py qobuz-extension
      - name: Add Qobuz 2026 WebView login and personal token validation
        run: |
          python3 - <<'PY'
          import zlib,base64,hashlib,pathlib
          raw=pathlib.Path('qobuz-build/patch_auth_v104.py.zlib.b64').read_text().strip()
          patch=zlib.decompress(base64.b64decode(raw))
          assert hashlib.sha256(patch).hexdigest() == 'e3ffee15cb30b1f4c509af871ae9916067d43b7a67d8b31ec7b4c49eb9d4a4dc'
          pathlib.Path('patch_auth_v104.py').write_bytes(patch)
          PY
          python3 patch_auth_v104.py qobuz-extension
      - name: Fix web player session callback for Qobuz Personal v1.0.5
        run: |
          python3 - <<'PY'
          import base64,hashlib,pathlib,zlib
          raw=pathlib.Path('qobuz-build/patch_auth_v105.py.zlib.b64').read_text().strip()
          patch=zlib.decompress(base64.b64decode(raw))
          assert hashlib.sha256(patch).hexdigest() == '70c8b3eef74d7ce6335a07a115eea2fd0a3589b60d8f40db284a7023b22ea571'
          pathlib.Path('patch_auth_v105.py').write_bytes(patch)
          PY
          python3 patch_auth_v105.py qobuz-extension
      - name: Validate personal Qobuz user ID for profile requests
        run: |
          python3 - <<'PY'
          import base64,hashlib,pathlib,zlib
          raw=pathlib.Path('qobuz-build/patch_auth_v106.py.zlib.b64').read_text().strip()
          patch=zlib.decompress(base64.b64decode(raw))
          assert hashlib.sha256(patch).hexdigest() == 'fb846b2a356f6d4295d10441f7f1cd31236fc45dd6e931c4944d3aba15787572'
          pathlib.Path('patch_auth_v106.py').write_bytes(patch)
          PY
          python3 patch_auth_v106.py qobuz-extension
      - name: Compile extension against available Android API 36
        working-directory: qobuz-extension
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
      - name: Build signed debug APK
        working-directory: qobuz-extension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gladix-Qobuz-Personal-v1.0.6-APK
          path: qobuz-extension/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
